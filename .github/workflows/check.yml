name: Checks
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --check web/camera.js
      - run: node tests/check_camera_js.cjs
      - run: node --check web/video.js
      - run: node tests/check_video_js.cjs
